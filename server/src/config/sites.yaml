sites:
  - id: sderot
    name: Sderot
    lat: 31.5253
    lon: 34.5951
    devices:
      - id: sderot-core-rtr
        name: Core Router
        type: router
        method: ping
        target: 1.1.1.1
        ping:
          timeoutMs: 3000
      - id: sderot-cctv-1
        name: Perimeter Camera 1
        type: camera
        method: mock
        target: 192.0.2.10
      - id: sderot-weather-api
        name: Weather Station
        type: sensor
        method: mock
        target: https://api.example.com/stations/sderot/status
