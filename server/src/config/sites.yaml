sites:
  - id: sderot
    name:
      en: Sderot
      he: שדרות
    lat: 31.5253
    lon: 34.5951
    devices:
      - id: sderot-core-rtr
        name:
          en: Core Router
          he: נתב ליבה
        type: router
        method: ping
        target: 1.1.1.1
        ping:
          timeoutMs: 3000
      - id: sderot-cctv-1
        name:
          en: Perimeter Camera 1
          he: מצלמת היקף 1
        type: camera
        method: mock
        target: 192.0.2.10
      - id: sderot-weather-api
        name:
          en: Weather Station
          he: תחנת מזג אוויר
        type: sensor
        method: mock
        target: https://api.example.com/stations/sderot/status
      - id: sderot-ptz-1
        name:
          en: PTZ Camera 1
          he: מצלמת PTZ 1
        type: ptz-camera
        method: mock
        target: 192.0.2.11
      - id: sderot-roip-1
        name:
          en: ROIP Gateway
